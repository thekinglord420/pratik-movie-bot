name: Start Fresh Movie Bot

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      API_ID: "36033911"
      API_HASH: "e66cab096ef6482d2a3b366b9e7606af"
      BOT_TOKEN: "8894292698:AAE12lJJmhG5rFQ7zDrPVXc2D-u6kLLsDAg"
      DATABASE_URI: "mongodb+srv://mybotuser:Pratik999@cluster0.q91rtql.mongodb.net/"
      CHANNELS: "-1003965297473"
      LOG_CHANNEL: "-1003965297473"
      IMDB: "False"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Pre-compiled Binary Packages
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --only-binary=:all: pyrogram==2.0.106 tgcrypto motor==3.3.2 pymongo==4.6.3 requests aiohttp pytz jinja2 umongo marshmallow beautifulsoup4 dnspython shortzy aiofiles Pillow
      - name: Bypass IMDb & Link Options Requirement Errors
        run: |
          mkdir -p imdbkit
          touch imdbkit/__init__.py
          echo "class IMDBKit: pass" > imdbkit/__init__.py
          # Fixing the Pyrogram LinkPreviewOptions path mismatch runtime drop
          python -c "import os; p='/opt/hostedtoolcache/Python/3.10.22/x64/lib/python3.10/site-packages/pyrogram/types/__init__.py'; open(p, 'a').write('\nLinkPreviewOptions = None\n')" || true
      - run: python bot.py
