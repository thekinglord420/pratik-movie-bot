jobs:
  run:
    runs-on: ubuntu-latest
    env:
      API_ID: "36033911"
      API_HASH: "e66cab096ef6482d2a3b366b9e7606af"
      BOT_TOKEN: "8894292698:AAE12lJJmhG5rFQ7zDrPVXc2D-u6kLLsDAg"
      DATABASE_URI: "mongodb+srv://mybotuser:Pratik999@cluster0.q91rtql.mongodb.net/"
      CHANNELS: "-1003965297473"
      LOG_CHANNEL: "-1003965297473"
      IMDB: "False"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Pre-compiled Upgraded Packages
        run: |
          pip install --upgrade pip setuptools wheel
          pip install tgcrypto motor==3.3.2 pymongo==4.6.3 requests aiohttp pytz jinja2 umongo marshmallow beautifulsoup4 dnspython shortzy aiofiles Pillow rapidfuzz rebulk python-dotenv
          pip install hydrogram
      - name: Global Environment Structural Patch
        run: |
          mkdir -p imdbkit
          touch imdbkit/__init__.py
          echo "class IMDBKit: pass" > imdbkit/__init__.py
          
          # Force python to map pyrogram layers and inject fallbacks for all parameters securely
          python -c "
          import site, os
          p = os.path.join(site.getsitepackages()[0], 'sitecustomize.py')
          code = '''import sys
          import hydrogram
          
          class DummyObj:
              def __init__(self, *args, **kwargs): pass
          
          def dummy_decorator(*args, **kwargs):
              return lambda f: f
          
          for attr in ['LinkPreviewOptions', 'LabeledPrice', 'PreCheckoutQuery', 'ShippingQuery']:
              if not hasattr(hydrogram.types, attr):
                  setattr(hydrogram.types, attr, DummyObj)
                  
          for dec in ['on_pre_checkout_query', 'on_shipping_query', 'on_raw_update']:
              if not hasattr(hydrogram.Client, dec):
                  setattr(hydrogram.Client, dec, dummy_decorator)
                  
          if not hasattr(hydrogram.filters, 'successful_payment'):
              setattr(hydrogram.filters, 'successful_payment', dummy_decorator)
          
          sys.modules['pyrogram'] = hydrogram
          sys.modules['pyrogram.types'] = hydrogram.types
          sys.modules['pyrogram.errors'] = hydrogram.errors
          sys.modules['pyrogram.enums'] = hydrogram.enums
          '''
          open(p, 'w').write(code)
          "
      - run: python bot.py
